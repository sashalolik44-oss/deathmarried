<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<!-- Жесткий запрет зума для мобилок -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>DEATHMARRIED KVARTIRA</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
/* =========================================================
   БАЗОВЫЕ НАСТРОЙКИ (ФИКС ЗУМА И РАСКЛАДКИ)
========================================================= */
:root {
    --wine: #702831;
    --gold: #aa8246;
    --ink: #2d1e19;
    --paper: #dfc9a8;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden; /* Запрет скролла всей страницы */
    background: #ded0b5;
    font-family: "Montserrat", sans-serif;
    touch-action: none; /* Отключает стандартные жесты браузера, включая зум */
}

/* Фон с обоями */
.wallpaper {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: linear-gradient(rgba(231,215,189,0.2), rgba(231,215,189,0.2)), 
                url("wallpaper.jpg") center/cover no-repeat;
    transition: filter 0.5s;
}

/* =========================================================
   ЗАСТАВКА (LOADING)
========================================================= */
.loading-screen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #eee3cb;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.8s;
}

.loading-screen.hide {
    opacity: 0;
    pointer-events: none;
}

.loading-text {
    font-family: "Cormorant Garamond", serif;
    font-size: 32px;
    letter-spacing: 0.2em;
    color: var(--wine);
    text-align: center;
    animation: pulse 1.5s infinite alternate;
}

@keyframes pulse {
    from { opacity: 0.5; transform: scale(0.98); }
    to { opacity: 1; transform: scale(1); }
}

/* =========================================================
   ИНТЕРФЕЙС (HUD)
========================================================= */
header {
    position: fixed;
    top: 20px;
    width: 100%;
    text-align: center;
    z-index: 100;
}

.logo-main {
    font-family: "Cormorant Garamond", serif;
    font-size: 42px;
    font-weight: 700;
    color: var(--wine);
    margin: 0;
}

.stats-top {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    width: 100%;
    z-index: 100;
}

.soul-count {
    font-family: "Cormorant Garamond", serif;
    font-size: 38px;
    font-weight: 600;
    color: var(--ink);
}

.bar-container {
    width: 200px;
    height: 4px;
    background: rgba(0,0,0,0.1);
    margin: 10px auto;
    border-radius: 2px;
    overflow: hidden;
}

.bar-fill {
    height: 100%;
    width: 0%;
    background: var(--wine);
    transition: width 0.3s;
}

/* =========================================================
   ГЛАВНЫЙ ОБЪЕКТ (ТЫКВА)
========================================================= */
.game-area {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
}

.character {
    position: relative;
    width: 300px;
    height: 300px;
    cursor: pointer;
    transition: transform 0.05s;
    touch-action: manipulation;
}

.character:active {
    transform: scale(0.92);
}

/* Рисуем тыкву через CSS (упрощенно для стабильности) */
.pumpkin-body {
    position: absolute;
    width: 220px;
    height: 180px;
    background: #d98446;
    border-radius: 50%;
    left: 40px;
    top: 60px;
    box-shadow: inset -20px -10px 30px rgba(0,0,0,0.3);
}

.headphones-css {
    position: absolute;
    width: 260px;
    height: 140px;
    border: 15px solid #222;
    border-bottom: none;
    border-radius: 130px 130px 0 0;
    left: 20px;
    top: 30px;
}

/* =============================
   МЕНЮ И ПАНЕЛИ
============================= */
.side-panel {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 280px;
    background: rgba(238, 222, 195, 0.95);
    border: 1px solid var(--gold);
    padding: 15px;
    z-index: 200;
    max-height: 80vh;
    overflow-y: auto;
}

.left-p { left: 20px; }
.right-p { right: 20px; }

.btn {
    width: 100%;
    padding: 10px;
    margin-bottom: 8px;
    background: #f1e7d0;
    border: 1px solid var(--gold);
    color: var(--ink);
    cursor: pointer;
    font-weight: 600;
}

.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Мобильная навигация */
.mobile-nav {
    display: none;
    position: fixed;
    bottom: 0;
    width: 100%;
    background: #eee3cb;
    grid-template-columns: repeat(4, 1fr);
    z-index: 1000;
    border-top: 1px solid var(--gold);
}

.mobile-nav button {
    padding: 15px 5px;
    background: none;
    border: none;
    font-size: 10px;
    font-weight: 600;
    color: var(--wine);
}

/* Стили для Босса */
#boss-ui {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 250px;
    background: #fff;
    border: 2px solid var(--wine);
    padding: 10px;
    display: none;
    z-index: 2000;
}

/* Адаптация */
@media (max-width: 1100px) {
    .side-panel { display: none; }
    .mobile-nav { display: grid; }
    .character { transform: scale(0.8); }
}
</style>
</head>

<body>

<div class="loading-screen" id="loader">
    <div class="loading-text">DEATHMARRIED<br>KVARTIRA</div>
</div>

<div class="wallpaper"></div>
<div class="floor"></div>
<div class="vignette"></div>

<header>
    <h1 class="logo-main">DeathMarried</h1>
    <div class="tag">KVARTIRA · CLICKER</div>
</header>

<div class="stats-top">
    <div class="soul-count">† <span id="souls-val">0</span></div>
    <div class="minor">Уровень <span id="lvl-val">1</span> · <span id="sps-val">0</span>/сек</div>
    <div class="bar-container"><div class="bar-fill" id="exp-bar"></div></div>
    <div class="bar-container" style="background:rgba(193,138,73,0.2)"><div class="bar-fill" id="rage-bar" style="background:#c18a49"></div></div>
</div>

<div class="game-area">
    <div class="character" id="pumpkin-tap">
        <div class="headphones-css"></div>
        <div class="pumpkin-body"></div>
        <div id="combo-text" style="position:absolute; width:100%; text-align:center; bottom:-30px; font-style:italic; color:var(--wine)"></div>
    </div>
</div>

<!-- Панели для ПК -->
<div class="side-panel left-p" id="panel-left">
    <h3 style="font-family:serif">Профиль</h3>
    <div class="stat">Всего душ: <strong id="stat-total">0</strong></div>
    <div class="stat">Ключей: <strong id="stat-keys">0</strong></div>
    <button class="btn" onclick="openChest()">Открыть сундук (1🔑)</button>
    <button class="btn" id="rage-btn" onclick="activateRage()">Ярость (x5)</button>
    <button class="btn" onclick="setLang('ru')">RU</button>
    <button class="btn" onclick="setLang('en')">EN</button>
</div>

<div class="side-panel right-p" id="panel-right">
    <h3 style="font-family:serif">Магазин</h3>
    <button class="btn" onclick="buyUp('click')">Нож (ур. <span id="l-click">0</span>) - <span id="c-click">25</span> †</button>
    <button class="btn" onclick="buyUp('auto')">Свеча (ур. <span id="l-auto">0</span>) - <span id="c-auto">50</span> †</button>
    <button class="btn" onclick="buyUp('crit')">Удача (ур. <span id="l-crit">0</span>) - <span id="c-crit">100</span> †</button>
    <hr>
    <button class="btn" onclick="startBossFight()">Вызвать Босса</button>
</div>

<!-- Мобильное меню -->
<div class="mobile-nav">
    <button onclick="showMob('profile')">ПРОФИЛЬ</button>
    <button onclick="showMob('shop')">МАГАЗИН</button>
    <button onclick="showMob('skins')">ОБЛИКИ</button>
    <button onclick="showMob('items')">ИНВЕНТАРЬ</button>
</div>

<!-- Босс Худ -->
<div id="boss-ui">
    <div style="font-size:10px; color:gray">БОЙ С ГОСТЕМ</div>
    <div id="boss-name" style="font-weight:bold; color:var(--wine)">БОСС КУКОЛДОВ</div>
    <div class="bar-container" style="width:100%"><div class="bar-fill" id="boss-hp-bar" style="width:100%"></div></div>
    <button class="btn" style="font-size:10px; margin:0" onclick="endBoss(false)">СБЕЖАТЬ</button>
</div>

<script>
/* =========================================================
   ЛОГИКА ИГРЫ
========================================================= */

let state = {
    souls: 0,
    lifetime: 0,
    clicks: 0,
    lvl: 1,
    keys: 0,
    rage: 0,
    upgrades: { click: 0, auto: 0, crit: 0 },
    inventory: [],
    unlockedSkins: ['default'],
    currentSkin: 'default',
    lang: 'ru'
};

// Загрузка
const saved = localStorage.getItem('dm_kvartira_pc');
if(saved) state = Object.assign(state, JSON.parse(saved));

const soulsEl = $("souls-val");
const clickObj = $("pumpkin-tap");

function updateUI() {
    soulsEl.innerText = fmt(state.souls);
    $("lvl-val").innerText = state.lvl;
    $("sps-val").innerText = fmt(getSPS());
    $("stat-total").innerText = fmt(state.lifetime);
    $("stat-keys").innerText = state.keys;
    
    // Бар опыта
    let nextLvl = Math.pow(state.lvl, 2) * 200;
    let prevLvl = Math.pow(state.lvl - 1, 2) * 200;
    let progress = ((state.lifetime - prevLvl) / (nextLvl - prevLvl)) * 100;
    $("exp-bar").style.width = progress + "%";
    
    if(progress >= 100) {
        state.lvl++;
        if(state.lvl % 5 === 0) state.keys++;
        tg?.HapticFeedback.notificationOccurred('success');
    }

    // Магазин
    $("l-click").innerText = state.upgrades.click;
    $("c-click").innerText = fmt(25 * Math.pow(1.5, state.upgrades.click));
    $("l-auto").innerText = state.upgrades.auto;
    $("c-auto").innerText = fmt(50 * Math.pow(1.6, state.upgrades.auto));
    
    $("rage-bar").style.width = state.rage + "%";
    $("rage-btn").disabled = state.rage < 100;
}

function getSPS() {
    return state.upgrades.auto * 2 * (1 + state.inventory.length * 0.05);
}

function fmt(n) {
    if(n < 1000) return Math.floor(n);
    if(n < 1000000) return (n/1000).toFixed(1) + "k";
    return (n/1000000).toFixed(1) + "m";
}

/* Клик */
let combo = 0;
let lastClick = 0;

clickObj.onclick = (e) => {
    let now = Date.now();
    if(now - lastClick < 500) combo++; else combo = 1;
    lastClick = now;

    let power = (1 + state.upgrades.click) * (1 + (combo * 0.01));
    
    // Крит
    if(Math.random() * 100 < (5 + state.upgrades.crit)) {
        power *= 3;
        showFloat(e.pageX, e.clientY, "КРИТ!", "var(--wine)");
        tg?.HapticFeedback.impactOccurred('heavy');
    } else {
        tg?.HapticFeedback.impactOccurred('light');
    }

    if(bossActive) {
        bossHP -= power;
        updateBoss();
    } else {
        state.souls += power;
        state.lifetime += power;
    }

    state.rage = Math.min(100, state.rage + 0.5);
    updateUI();
    
    $("combo-text").innerText = combo > 5 ? "Серия: " + combo : "";
};

/* Босс */
let bossActive = false;
let bossHP = 0;
let bossMax = 1000;

function startBossFight() {
    if(bossActive) return;
    bossActive = true;
    bossMax = state.lvl * 1500;
    bossHP = bossMax;
    $("boss-ui").style.display = "block";
    updateBoss();
}

function updateBoss() {
    $("boss-hp-bar").style.width = (bossHP/bossMax)*100 + "%";
    if(bossHP <= 0) endBoss(true);
}

function endBoss(win) {
    bossActive = false;
    $("boss-ui").style.display = "none";
    if(win) {
        let reward = bossMax * 0.5;
        state.souls += reward;
        state.lifetime += reward;
        if(Math.random() > 0.5) state.keys++;
        alert("Победа! Награда: " + fmt(reward));
    }
}

function buyUp(type) {
    let cost = type === 'click' ? 25 * Math.pow(1.5, state.upgrades.click) : 
               type === 'auto' ? 50 * Math.pow(1.6, state.upgrades.auto) : 100;
    
    if(state.souls >= cost) {
        state.souls -= cost;
        state.upgrades[type]++;
        updateUI();
        save();
    }
}

function showFloat(x, y, txt, color) {
    let el = document.createElement("div");
    el.innerText = txt;
    el.style.position = "fixed";
    el.style.left = x + "px";
    el.style.top = y + "px";
    el.style.color = color;
    el.style.fontWeight = "bold";
    el.style.pointerEvents = "none";
    el.style.zIndex = "2000";
    document.body.appendChild(el);
    let ty = y;
    let int = setInterval(() => {
        ty -= 2;
        el.style.top = ty + "px";
        el.style.opacity = (el.style.opacity || 1) - 0.05;
        if(el.style.opacity <= 0) { clearInterval(int); el.remove(); }
    }, 30);
}

function save() {
    localStorage.setItem('dm_kvartira_pc', JSON.stringify(state));
}

function setLang(l) {
    state.lang = l;
    save();
    location.reload();
}

// Удаление лоадера
window.onload = () => {
    setTimeout(() => $("loader").classList.add("hide"), 1500);
    initTelegram();
    updateUI();
    setInterval(() => {
        if(!bossActive) {
            state.souls += getSPS() / 10;
            state.lifetime += getSPS() / 10;
            updateUI();
        }
    }, 100);
    setInterval(save, 5000);
};

/* Спец функции для мобилки */
function showMob(type) {
    if(type === 'shop') {
        alert("Используй правую панель или купи улучшение: Нож - " + state.upgrades.click);
    } else {
        alert("Раздел " + type + " будет расширен в следующем DLC!");
    }
}
</script>

</body>
</html>
