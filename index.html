<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>DEATHMARRIED KVARTIRA</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --wine:#702831;
  --wine2:#421a21;
  --cream:#eee0c6;
  --paper:#dfc9a8;
  --gold:#aa8246;
  --ink:#2e201b;
  --muted:#806b5e;
  --room-light:rgba(255,230,190,.1);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  width:100%;
  height:100%;
  touch-action:manipulation;
}

body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#ded0b5;
  color:var(--ink);
  font-family:"Montserrat",Arial,sans-serif;
  overscroll-behavior:none;
}

button,
.game,
.character,
.quick,
.mobile-nav,
.tiggo{
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
}

/* =============================
   LOADING
============================= */

.loading{
  position:fixed;
  inset:0;
  z-index:10000;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eee3cc;
  transition:opacity 1s,visibility 1s;
}

.loading.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.loading-text{
  text-align:center;
  color:#5d252b;
  font:600 clamp(32px,7vw,78px) "Cormorant Garamond",serif;
  letter-spacing:.12em;
  animation:loadingPulse 1.4s ease-in-out infinite alternate;
}

@keyframes loadingPulse{
  to{
    opacity:.55;
    letter-spacing:.16em;
  }
}

/* =============================
   BACKGROUND
============================= */

.wallpaper{
  position:fixed;
  inset:0;
  z-index:-10;
  background:
    linear-gradient(var(--room-light),var(--room-light)),
    url("wallpaper.jpg?v=4") center/cover no-repeat;
  transition:filter .8s,background .8s;
}

.floor{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:12vh;
  z-index:-8;
  border-top:5px solid #493127;
  background:
    repeating-linear-gradient(
      100deg,
      #583b2c 0 80px,
      #402a22 81px 84px,
      #684737 85px 165px
    );
}

.vignette{
  position:fixed;
  inset:0;
  z-index:-5;
  pointer-events:none;
  box-shadow:inset 0 0 180px rgba(67,42,29,.16);
}

.room-hall{--room-light:rgba(255,230,190,.08)}
.room-salon{--room-light:rgba(133,41,52,.13)}
.room-dj{--room-light:rgba(44,78,119,.19)}
.room-bedroom{--room-light:rgba(104,59,79,.16)}
.room-kitchen{--room-light:rgba(198,145,76,.12)}
.room-bath{--room-light:rgba(75,118,128,.15)}
.room-balcony{--room-light:rgba(58,70,92,.17)}
.room-secret{--room-light:rgba(31,20,20,.37)}

.room-secret .wallpaper{
  filter:brightness(.67) sepia(.1);
}

.room-dj .wallpaper{
  filter:saturate(.72) contrast(1.08);
}

/* =============================
   NIGHT / FEVER
============================= */

.night-layer,
.fever-layer{
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:0;
  z-index:5;
  transition:opacity 1s;
}

.night-layer{
  background:rgba(17,21,34,.61);
}

.fever-layer{
  background:
    radial-gradient(circle at 50% 50%,transparent,#85293622),
    linear-gradient(115deg,#8a29331d,#345a8018);
  animation:fever 1s alternate infinite;
}

body.night .night-layer{opacity:1}
body.fever .fever-layer{opacity:1}

@keyframes fever{
  to{filter:hue-rotate(25deg)}
}

/* =============================
   HEADER
============================= */

header{
  position:fixed;
  top:13px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  text-align:center;
  pointer-events:none;
}

.logo{
  color:var(--wine);
  font:600 clamp(29px,4vw,49px)/.9 "Cormorant Garamond",serif;
  letter-spacing:.12em;
}

.tag{
  margin-top:6px;
  color:#866e60;
  font-size:7px;
  letter-spacing:.45em;
}

/* =============================
   LANGUAGE
============================= */

.language{
  position:fixed;
  top:13px;
  left:14px;
  z-index:1500;
  display:flex;
  border:1px solid #9b795b;
  background:#e4cfadef;
}

.language button{
  padding:7px 10px;
  border:0;
  color:#755d51;
  background:transparent;
  cursor:pointer;
}

.language button.active{
  background:var(--wine);
  color:white;
}

/* =============================
   STATS
============================= */

.stats{
  position:fixed;
  top:80px;
  left:50%;
  z-index:25;
  width:390px;
  transform:translateX(-50%);
  text-align:center;
  pointer-events:none;
}

.souls{
  color:var(--wine2);
  font:600 35px "Cormorant Garamond",serif;
}

.minor{
  color:#7e6a5e;
  font-size:8px;
}

.level-line{
  margin-top:4px;
  color:#5b4138;
  font:italic 12px "Cormorant Garamond",serif;
}

.bar{
  width:245px;
  height:5px;
  margin:5px auto;
  border:1px solid #a0886e;
  background:#ae99832f;
  overflow:hidden;
}

.bar-fill{
  height:100%;
  width:0%;
  background:var(--wine);
  transition:width .15s;
}

#rageBar{
  background:#c18a49;
}

/* =============================
   QUICK LEFT
============================= */

.quick{
  position:fixed;
  left:14px;
  top:96px;
  z-index:1200;
  width:210px;
  padding:5px;
  border:1px solid #9d7c5f;
  background:#e7d3b4e8;
  backdrop-filter:blur(9px);
}

.quick-row{
  display:grid;
  grid-template-columns:28px 1fr 28px;
  gap:3px;
}

.quick-row + .quick-row{
  margin-top:3px;
}

.quick button{
  border:1px solid #a08162;
  background:#ead7b9;
  color:#603b32;
  font-size:18px;
  cursor:pointer;
}

.quick-current{
  min-width:0;
  padding:4px;
  text-align:center;
  border:1px solid #ae9273;
  background:#f0dec2a8;
}

.quick-title{
  color:#9a806d;
  font-size:5px;
  letter-spacing:.13em;
}

.quick-name{
  overflow:hidden;
  margin-top:1px;
  color:#54332d;
  font:600 12px "Cormorant Garamond",serif;
  white-space:nowrap;
  text-overflow:ellipsis;
}

/* =============================
   GAME
============================= */

.game{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
}

.character{
  position:relative;
  width:360px;
  height:350px;
  margin-top:90px;
  cursor:pointer;
  touch-action:manipulation;
  transition:transform .06s;
  filter:drop-shadow(0 28px 22px rgba(55,31,21,.38));
}

.character:hover{
  transform:scale(1.02);
}

.character.hit{
  transform:scale(.92) rotate(-2deg);
}

/* pumpkin */

.pumpkin{
  position:absolute;
  left:60px;
  top:72px;
  width:240px;
  height:190px;
}

.stem{
  position:absolute;
  left:104px;
  top:-39px;
  width:31px;
  height:52px;
  border-radius:8px;
  transform:rotate(7deg);
  background:linear-gradient(90deg,#382619,#81633a,#322218);
}

.lobe{
  position:absolute;
  top:0;
  height:185px;
  border-radius:50%;
  background:
    radial-gradient(circle at 42% 25%,#dd8949,transparent 27%),
    linear-gradient(90deg,#753120,#b95b30,#722c20);
  box-shadow:inset 0 -18px 25px #49181466;
}

.a{left:0;width:100px}
.b{left:38px;width:122px;z-index:1}
.c{right:0;width:100px}
.d{right:38px;width:122px;z-index:1}

.face{
  position:absolute;
  inset:0;
  z-index:5;
}

.eye{
  position:absolute;
  top:68px;
  width:46px;
  height:31px;
  background:#251410;
  clip-path:polygon(0 0,100% 28%,72% 100%,14% 72%);
}

.eye::after{
  content:"";
  position:absolute;
  left:17px;
  top:11px;
  width:12px;
  height:6px;
  background:#d29558;
  box-shadow:0 0 7px #ad5137;
}

.eye.left{left:49px}
.eye.right{right:49px;transform:scaleX(-1)}

.mouth{
  position:absolute;
  left:64px;
  top:120px;
  width:112px;
  height:47px;
  background:#24130f;
  clip-path:polygon(
    0 25%,15% 38%,25% 10%,39% 44%,51% 6%,
    64% 43%,77% 12%,88% 41%,100% 22%,
    90% 78%,70% 88%,50% 72%,30% 89%,10% 77%
  );
}

/* headphones */

.phones{
  position:absolute;
  left:42px;
  top:38px;
  width:275px;
  height:190px;
  z-index:9;
  pointer-events:none;
}

.band{
  position:absolute;
  left:28px;
  width:219px;
  height:155px;
  border:20px solid #24201e;
  border-bottom:none;
  border-radius:130px 130px 0 0;
  box-shadow:inset 0 0 0 3px #584b44;
}

.ear{
  position:absolute;
  top:100px;
  width:51px;
  height:85px;
  border:4px solid #493b35;
  border-radius:17px;
  background:linear-gradient(90deg,#171312,#3b302c,#161211);
}

.ear::after{
  content:"";
  position:absolute;
  inset:15px 9px;
  border-radius:10px;
  background:var(--wine);
}

.ear.left{left:4px;transform:rotate(-7deg)}
.ear.right{right:4px;transform:rotate(7deg)}

/* =============================
   SKIN EXTRAS
============================= */

.dj-console,.horns,.crown,.void-aura,.veil,.halo,.glasses{
  display:none;
  pointer-events:none;
}

.dj-console{
  position:absolute;
  left:54px;
  top:229px;
  z-index:15;
  width:252px;
  height:78px;
  border:5px solid #442e27;
  background:linear-gradient(#752c34,#3b1e20);
  transform:perspective(300px) rotateX(20deg);
}

.deck{
  position:absolute;
  top:14px;
  width:49px;
  height:49px;
  border:5px solid #ae8850;
  border-radius:50%;
  background:radial-gradient(circle,#762b33 0 9%,#28201e 10% 55%,#5b4437 57%);
}

.deck.left{left:18px}
.deck.right{right:18px}

.mixer{
  position:absolute;
  left:90px;
  top:13px;
}

.mixer span{
  display:inline-block;
  width:6px;
  height:39px;
  margin:3px;
  background:linear-gradient(#ddc69f,#a98246,#4b2022);
}

.skin-dj .dj-console{display:block}
.skin-dj .deck{animation:spin 1.5s linear infinite}

@keyframes spin{to{transform:rotate(360deg)}}

.horns{
  position:absolute;
  left:70px;
  top:34px;
  width:220px;
  z-index:7;
  justify-content:space-between;
}

.horn{
  width:48px;
  height:75px;
  background:linear-gradient(#68413a,#211414);
  clip-path:polygon(50% 0,100% 100%,25% 80%);
}

.horn:last-child{transform:scaleX(-1)}
.skin-hell .horns{display:flex}

.crown{
  position:absolute;
  left:130px;
  top:4px;
  z-index:15;
  color:#b18c50;
  font:75px Georgia,serif;
}

.skin-king .crown{display:block}

.void-aura{
  position:absolute;
  left:40px;
  top:43px;
  z-index:-1;
  width:280px;
  height:245px;
  border-radius:50%;
  background:#64273b20;
  box-shadow:0 0 70px #67273a55;
  animation:aura 1s alternate infinite;
}

.skin-void .void-aura{display:block}

.skin-void .lobe{
  background:
    radial-gradient(circle at 42% 25%,#8c5a61,transparent 24%),
    linear-gradient(90deg,#29161a,#5e2931,#221215);
}

@keyframes aura{to{transform:scale(1.1)}}

.glasses{
  position:absolute;
  left:108px;
  top:137px;
  z-index:20;
  width:145px;
  height:30px;
  border-top:8px solid #171414;
}

.glasses::before,
.glasses::after{
  content:"";
  position:absolute;
  top:-7px;
  width:55px;
  height:28px;
  background:#19191bdd;
  border:3px solid #a68d69;
}

.glasses::before{left:0;transform:skew(-8deg)}
.glasses::after{right:0;transform:skew(8deg)}

.skin-night .glasses{display:block}

.veil{
  position:absolute;
  left:75px;
  top:70px;
  z-index:18;
  width:210px;
  height:180px;
  border-radius:50% 50% 35% 35%;
  opacity:.34;
  background:
    repeating-linear-gradient(45deg,#251b20 0 2px,transparent 2px 8px);
}

.skin-bride .veil{display:block}

.halo{
  position:absolute;
  left:105px;
  top:31px;
  z-index:17;
  width:150px;
  height:33px;
  border:5px solid #c2a365;
  border-radius:50%;
  box-shadow:0 0 15px #d6ba7755;
}

.skin-saint .halo{display:block}

/* =============================
   COMBO
============================= */

.combo{
  position:absolute;
  bottom:12px;
  width:100%;
  text-align:center;
  color:var(--wine);
  font:italic 16px "Cormorant Garamond",serif;
  opacity:0;
}

.combo.show{opacity:1}

/* =============================
   DESKTOP PANELS
============================= */

.panel{
  position:fixed;
  z-index:100;
  width:315px;
  padding:13px;
  border:1px solid #967657;
  color:#412e28;
  background:rgba(229,210,178,.92);
  box-shadow:0 9px 30px rgba(58,35,25,.16);
  backdrop-filter:blur(12px);
}

.left-panel{
  left:16px;
  top:58%;
  transform:translateY(-50%);
}

.right-panel{
  right:16px;
  top:50%;
  transform:translateY(-50%);
}

.tabs{
  display:flex;
  gap:2px;
  margin-bottom:8px;
}

.tab{
  flex:1;
  min-height:31px;
  border:0;
  border-bottom:1px solid #a2886a;
  color:#786156;
  background:none;
  font:600 7px Montserrat,sans-serif;
  cursor:pointer;
}

.tab.active{
  color:var(--wine);
  border-bottom:2px solid var(--wine);
}

.content{display:none}
.content.active{display:block}

.panel-title{
  color:var(--wine2);
  font:600 18px "Cormorant Garamond",serif;
}

.stat{
  padding:5px 0;
  border-bottom:1px dotted #72513d44;
  color:#755e53;
  font:13px "Cormorant Garamond",serif;
}

.stat strong{
  float:right;
  color:#462e27;
}

.action,
.shop-item{
  width:100%;
  min-height:42px;
  margin-top:6px;
  padding:8px 9px;
  border:1px solid #a18568;
  color:#49332c;
  background:rgba(245,228,200,.58);
  cursor:pointer;
}

.shop-item{text-align:left}

.action:hover,
.shop-item:hover{
  border-color:var(--wine);
  background:#f6e7cf;
}

.action:disabled,
.shop-item:disabled{
  opacity:.37;
  cursor:not-allowed;
}

.shop-item b{
  display:block;
  color:#58352d;
  font:600 15px "Cormorant Garamond",serif;
}

.desc{
  color:#806b60;
  font-size:8px;
}

.price{
  margin-top:3px;
  color:var(--wine);
  font:600 13px "Cormorant Garamond",serif;
}

/* =============================
   MODAL
============================= */

.modal-bg{
  position:fixed;
  inset:0;
  z-index:5000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:14px;
  background:rgba(45,27,21,.43);
  backdrop-filter:blur(4px);
}

.modal-bg.open{display:flex}

.modal{
  width:min(540px,100%);
  max-height:84vh;
  overflow:auto;
  padding:15px;
  border:1px solid #89684e;
  background:#ead9bd;
  box-shadow:0 20px 70px #331c1766;
  overscroll-behavior:contain;
}

.modal-header{
  position:sticky;
  top:-15px;
  z-index:5;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:-15px -15px 10px;
  padding:14px 15px 10px;
  background:#ead9bd;
}

.modal-title{
  color:var(--wine2);
  font:600 23px "Cormorant Garamond",serif;
}

.close{
  width:35px;
  height:35px;
  border:1px solid #98765a;
  color:#63453a;
  background:none;
  cursor:pointer;
}

/* =============================
   CARDS
============================= */

.card{
  margin:7px 0;
  padding:9px;
  border:1px solid #ac8e70;
  background:#f7e5c775;
}

.card.selected{
  border-color:var(--wine);
  background:#7129330e;
}

.card.locked{opacity:.55}

.card-name{
  color:#56342d;
  font:600 16px "Cormorant Garamond",serif;
}

.card-info{
  margin-top:2px;
  color:#806b60;
  font-size:8px;
}

.card button{
  width:100%;
  min-height:34px;
  margin-top:6px;
  border:1px solid #98785b;
  color:#513129;
  background:#dec6a4;
}

/* =============================
   INVENTORY
============================= */

.inventory-summary{
  padding:8px;
  margin-bottom:8px;
  border:1px solid #aa8b6b;
  background:#f8e9cf77;
  color:#695044;
  font-size:8px;
  line-height:1.7;
}

.loot{
  margin:6px 0;
  padding:8px;
  border-left:3px solid #7e746a;
  background:#f7e8ce77;
}

.loot.common{border-color:#777269}
.loot.rare{border-color:#315e7c}
.loot.epic{border-color:#754773}
.loot.legendary{border-color:#a07825}
.loot.cursed{border-color:#7f202e;background:#7e25300c}
.loot.mythic{border-color:#b55f25;box-shadow:inset 0 0 15px #c47b2820}

.loot-name{
  font:600 14px "Cormorant Garamond",serif;
}

.loot-stat{
  margin-top:2px;
  color:#77655b;
  font-size:8px;
}

/* =============================
   ACHIEVEMENT / LEVEL REWARD
============================= */

.reward-pop{
  position:fixed;
  inset:0;
  z-index:7000;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  background:#36211966;
  animation:rewardFade 2.8s forwards;
}

.reward-box{
  width:min(430px,85vw);
  padding:27px;
  text-align:center;
  border:1px solid #947154;
  outline:1px solid #b38e65;
  outline-offset:-7px;
  background:#ecddc3;
}

.reward-small{
  color:#947766;
  font-size:7px;
  letter-spacing:.3em;
}

.reward-name{
  margin-top:8px;
  color:var(--wine);
  font:600 28px "Cormorant Garamond",serif;
}

@keyframes rewardFade{
  0%,78%{opacity:1}
  100%{opacity:0}
}

/* =============================
   BOSS
============================= */

.boss{
  position:fixed;
  right:14px;
  top:14px;
  z-index:1800;
  display:none;
  width:305px;
  padding:12px;
  border:1px solid #8c6c51;
  background:#ebdabeF7;
  box-shadow:0 12px 40px #371f183d;
}

.boss.show{display:block}

.boss.enraged{
  animation:bossPulse .45s alternate infinite;
}

@keyframes bossPulse{
  to{box-shadow:0 0 35px #81263655}
}

.boss-kicker{
  color:#947969;
  font-size:6px;
  letter-spacing:.23em;
}

.boss-name{
  color:var(--wine2);
  font:600 22px "Cormorant Garamond",serif;
}

.boss-skill{
  margin-top:3px;
  color:#8b5d55;
  font-size:7px;
}

.hp{
  height:8px;
  margin:6px 0 4px;
  overflow:hidden;
  background:#b09a83;
}

.hp-fill{
  height:100%;
  width:100%;
  background:var(--wine);
  transition:width .1s;
}

/* =============================
   CHEST / DOORBELL
============================= */

.event-card{
  position:fixed;
  left:50%;
  top:195px;
  z-index:1900;
  display:none;
  width:310px;
  transform:translateX(-50%);
  padding:11px;
  text-align:center;
  border:1px solid #987356;
  background:#eeddbff7;
  box-shadow:0 10px 35px #32201833;
}

.event-card.show{display:block}

.event-title{
  color:var(--wine);
  font:600 19px "Cormorant Garamond",serif;
}

.event-buttons{
  display:flex;
  gap:5px;
  margin-top:8px;
}

.event-buttons button{
  flex:1;
  min-height:37px;
  border:1px solid #9a785b;

}

   CHASE
============================= */

.chase{
  position:fixed;

============================= */

.message{
  position:fixed;
  left:50%;
  top:22%;
  z-index:6500;
  transform:translateX(-50%);
  max-width:calc(100% - 25px);
  padding:11px 18px;
  text-align:center;
  border:1px solid #987252;
  background:#eddbbef8;
  color:#59362e;
  font:italic 17px "Cormorant Garamond",serif;
  pointer-events:none;
  animation:msg 2.3s forwards;
}

@keyframes msg{
  0%{opacity:0;transform:translate(-50%,12px)}
  15%,78%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-25px)}
}

.float{
  position:fixed;

/* =========================
   FORMAT
========================= */

function fmt(n){
  n=Math.floor(Number(n)||0);

  if(n<1000)return n.toLocaleString(lang==="ru"?"ru-RU":"en-US");
  if(n<1e6)return(n/1e3).toFixed(1)+"K";
  if(n<1e9)return(n/1e6).toFixed(1)+"M";
  if(n<1e12)return(n/1e9).toFixed(1)+"B";
  return(n/1e12).toFixed(1)+"T";
}

/* =========================
   LEVEL
========================= */

function level(){
  return Math.floor(Math.sqrt(g.lifetime/210))+1;
}

function levelProgress(){
  const l=level();
  const a=(l-1)**2*210;
  const b=l**2*210;

  return((g.lifetime-a)/(b-a))*100;
}

/* =========================
   ITEM BONUS
========================= */

function itemBonus(stat){
  return g.loot.reduce((sum,item)=>{
    let n=sum;

    if(item.stat===stat)n+=Number(item.value)||0;
    if(item.penaltyStat===stat)n+=Number(item.penalty)||0;

    return n;
  },0);
}

/* =========================
   MULTIPLIERS
========================= */

let eventMulti=1;
let rageActive=false;
let feverActive=false;

function prestigeMulti(){
  return 1+g.prestiges*.22;
}

function recordMulti(){
  return 1+g.records.length*.04;
}

function skinAll(){
  if(g.currentSkin==="king")return 1.25;
  if(g.currentSkin==="saint")return 1.15;
  if(g.currentSkin==="void")return 1.5;
  return 1;
}

function roomAll(){
  return g.currentRoom==="secret"?1.4:1;
}

function allMulti(){
  return prestigeMulti()
    *recordMulti()
    *Math.max(.2,1+itemBonus("global"))
    *skinAll()
    *roomAll()
    *eventMulti;
}

function baseClick(){
  return 1+g.clickLvl;
}

function clickMulti(){
  let m=Math.max(.2,1+itemBonus("click"));

  if(g.currentSkin==="dj")m*=1.2;
  if(g.currentRoom==="hall")m*=1.1;

  return m;
}

function passiveBase(){
  return g.autoLvl+g.ringLvl*5;
}

function passiveMulti(){
  let m=Math.max(.2,1+itemBonus("passive"));

  if(g.currentRoom==="salon")m*=1.25;
  if(g.currentSkin==="bride")m*=1.25;

  return m;
}

function critChance(){
  let chance=g.critLvl*.02+itemBonus("crit");

  if(g.currentSkin==="night")chance+=.05;
  if(g.currentSkin==="saint")chance+=.05;
  if(g.currentRoom==="balcony")chance+=.15;

  return Math.min(.62,chance);
}

function critPower(){
  return 3+g.critPowerLvl+(g.currentSkin==="hell"?1:0);
}

function dropBonus(){
  return g.currentRoom==="bedroom"?.20:0;
}

/* =========================
   UNLOCKS + LEVEL REWARDS
========================= */

let previousLevel=level();

function checkUnlocks(){
  SKINS.forEach(s=>{
    if(level()>=s.level&&!g.unlockedSkins.includes(s.id)){
      g.unlockedSkins.push(s.id);
      rewardPopup(
        lang==="ru"?"НОВЫЙ ОБЛИК":"NEW SKIN",
        s[lang][0]
      );
    }
  });

  ROOMS.forEach(r=>{
    if(level()>=r.level&&!g.unlockedRooms.includes(r.id)){
      g.unlockedRooms.push(r.id);
      rewardPopup(
        lang==="ru"?"НОВАЯ КОМНАТА":"NEW ROOM",
        r[lang][0]
      );
    }
  });

  const now=level();

  if(now>previousLevel){
    for(let l=previousLevel+1;l<=now;l++){
      levelReward(l);
    }
    previousLevel=now;
  }
}

function levelReward(lvl){
  if(g.levelRewards.includes(lvl))return;

  g.levelRewards.push(lvl);

  let reward=100+lvl*60;

  if(lvl%5===0){
    reward*=3;
    g.keys++;
  }

  addSoulsRaw(reward);

  rewardPopup(
    lang==="ru"?"НОВЫЙ УРОВЕНЬ":"LEVEL UP",
    `${lvl} · +${fmt(reward)} ♱${lvl%5===0?" · +1 🔑":""}`
  );
}

function rewardPopup(top,name){
  haptic("success");

  const e=document.createElement("div");
  e.className="reward-pop";

  e.innerHTML=`
    <div class="reward-box">
      <div class="reward-small">${top}</div>
      <div class="reward-name">${name}</div>
    </div>
  `;

  document.body.appendChild(e);

  setTimeout(()=>e.remove(),2800);
}

/* =========================
   QUICK SWITCH
========================= */

function switchUnlocked(kind,direction){
  const data=kind==="skin"?SKINS:ROOMS;
  const unlocked=kind==="skin"?g.unlockedSkins:g.unlockedRooms;
  const current=kind==="skin"?g.currentSkin:g.currentRoom;

  const available=data.filter(x=>unlocked.includes(x.id));

  if(available.length<2)return;

  let index=available.findIndex(x=>x.id===current);
  if(index<0)index=0;

  index=(index+direction+available.length)%available.length;

  if(kind==="skin"){
    g.currentSkin=available[index].id;
    applySkin();
  }else{
    g.currentRoom=available[index].id;
    applyRoom();
  }

  haptic("select");
  save();
  update();
}

$("skinPrev").onclick=()=>switchUnlocked("skin",-1);
$("skinNext").onclick=()=>switchUnlocked("skin",1);
$("roomPrev").onclick=()=>switchUnlocked("room",-1);
$("roomNext").onclick=()=>switchUnlocked("room",1);

/* =========================
   LOOT
========================= */

function makeLoot(good=false){
  let roll=Math.random();

  if(good)roll=.6+Math.random()*.4;

  let rarity;
  let base;

  if(roll<.42){
    rarity="common";base=.02;
  }else if(roll<.74){
    rarity="rare";base=.045;
  }else if(roll<.91){
    rarity="epic";base=.09;
  }else if(roll<.975){
    rarity="legendary";base=.18;
  }else if(roll<.995){
    rarity="cursed";base=.34;
  }else{
    rarity="mythic";base=.55;
  }

  const stats=["click","passive","global","crit"];
  const stat=stats[Math.floor(Math.random()*stats.length)];

  let value=base*(.8+Math.random()*.4);

  if(stat==="crit")value*=.3;

  const item={
    key:Math.floor(Math.random()*ITEMS.ru.length),
    rarity,
    stat,
    value,
    penaltyStat:null,
    penalty:0
  };

  if(rarity==="cursed"){
    const options=["click","passive","global"].filter(x=>x!==stat);
    item.penaltyStat=options[Math.floor(Math.random()*options.length)];
    item.penalty=-.10;
  }

  g.loot.push(item);

  if(g.loot.length>60){
    g.loot=g.loot.slice(-60);
  }

  haptic("success");

  message(
    (lang==="ru"?"Выпал предмет: ":"Item dropped: ")+
    ITEMS[lang][item.key]
  );

  save();
}

function statName(stat){
  const names={
    ru:{
      click:"сила нажатия",
      passive:"пассивный доход",
      global:"общий доход",
      crit:"шанс крита"
    },
    en:{
      click:"click power",
      passive:"passive income",
      global:"all income",
      crit:"critical chance"
    }
  };

  return names[lang][stat];
}

      ${lang==="ru"?"Общий":"Global"}: ${(itemBonus("global")*100).toFixed(1)}%<br>
      ${lang==="ru"?"Крит":"Crit"}: ${(itemBonus("crit")*100).toFixed(1)}%

  `;

  const list=g.loot.length

function createContracts(){
  g.contracts=Object.keys(CONTRACTS)
    .sort(()=>Math.random()-.5)
    .slice(0,3)
    .map(type=>({
      type,
      progress:0,
      done:false
    }));
}

if(!g.contracts.length)createContracts();

function contractProgress(type,amount){
  g.contracts.forEach(c=>{
    if(c.done||c.type!==type)return;

    const data=CONTRACTS[c.type];

    c.progress=Math.min(data.target,c.progress+amount);

    if(c.progress>=data.target){
      c.done=true;

      const reward=data.reward*allMulti();

      addSoulsRaw(reward);

      haptic("success");

      message(
        (lang==="ru"?"Задание выполнено · +":"Task completed · +")+
        fmt(reward)
      );
    }
  });
}

function renderContracts(){
  $("contracts").innerHTML=g.contracts.map(c=>{
    const d=CONTRACTS[c.type];
    const percent=Math.min(100,c.progress/d.target*100);

    return `
      <div class="card">
        <div class="card-name">
          ${c.done?"✓ ":""}${d[lang]}
        </div>
        <div class="bar" style="width:100%">
          <div class="bar-fill" style="width:${percent}%"></div>
        </div>
        <div class="card-info">
          ${fmt(c.progress)} / ${fmt(d.target)}
          · ♱ ${fmt(d.reward)}
        </div>
      </div>
    `;
  }).join("");
}

function addSoulsRaw(amount){

  contractProgress("souls",amount);

/* =========================
   CLICK
========================= */

let combo=0;
let lastClick=0;

$("character").addEventListener("pointerdown",e=>{
  if(e.pointerType==="touch")e.preventDefault();

  haptic("light");

  const now=Date.now();

  combo=now-lastClick<470?combo+1:1;
  lastClick=now;

  const comboSpeed=g.currentRoom==="dj"?2:1;

  const comboMulti=Math.min(
    2.35,
    1+(combo-1)*.02*comboSpeed
  );

  let amount=baseClick()*clickMulti()*allMulti()*comboMulti;

  let critical=false;
  let jackpot=false;

  const critRoll=Math.random();

  if(critRoll<critChance()){
    critical=true;

    amount*=critPower();
    g.criticals++;

    /*
    8% критов становятся супер-критом.
    */
    if(Math.random()<.08){
      amount*=3;
    }

    haptic("heavy");
  }

  /*
  Очень редкий jackpot click.
  */
  if(Math.random()<.0025){
    jackpot=true;
    amount*=25;
    haptic("success");
  }

  if(rageActive)amount*=5;
  if(feverActive)amount*=2;

  amount=Math.ceil(amount);

  if(bossActive){
    bossDamage(amount);
  }else{
    addSouls(amount);
  }

  g.clicks++;

  let rageGain=.5;

  if(g.currentRoom==="bath")rageGain*=1.5;

  g.rage=Math.min(100,g.rage+rageGain);

  contractProgress("clicks",1);

  let text="+"+fmt(amount);
  let css="";

  if(critical){
    text=tx("critical")+" +"+fmt(amount);
    css="crit";
  }

  if(jackpot){
    text=tx("jackpot")+" +"+fmt(amount);
    css="jackpot";
  }

  floatText(e.clientX,e.clientY,text,css);

  $("combo").textContent=
    tx("combo")+" "+combo+" · x"+comboMulti.toFixed(2);

  $("combo").classList.add("show");

  $("character").classList.add("hit");

  setTimeout(()=>$("character").classList.remove("hit"),65);

  /*
  Комбо награды.
  */
  if(combo===50){
    message(lang==="ru"?"Серия 50 · +5% ярости":"Combo 50 · +5% rage");
    g.rage=Math.min(100,g.rage+5);
  }

  if(combo===100){
    startFever();
  }

  update();
},{passive:false});

setInterval(()=>{
  if(Date.now()-lastClick>820){
    combo=0;
    $("combo").classList.remove("show");
  }
},150);

const PRICE={
  click:1.62,
  auto:1.66,
  ring:1.76,
  crit:1.96,
  critPower:2.12
};

function buy(type){
  const cost=type+"Cost";
  const lvl=type+"Lvl";

  if(g.souls<g[cost])return;

  g.souls-=g[cost];
  g[lvl]++;
  g[cost]=Math.floor(g[cost]*PRICE[type]);

  contractProgress("upgrades",1);

  haptic("select");

  save();
  update();
}

$("buyClick").onclick=()=>buy("click");

   BOSS
========================= */

let bossActive=false;
let bossHP=0;
let bossMax=0;
let bossPhase=1;
let bossShield=1;

const BOSS_VARIANTS={
  ru:[
    "ОБЫЧНЫЙ БОСС КУКОЛДОВ",
    "БОРДОВЫЙ БОСС КУКОЛДОВ",
    "НОЧНОЙ БОСС КУКОЛДОВ",
    "БОСС КУКОЛДОВ ИЗ КВ. 13",
    "АБСОЛЮТНЫЙ БОСС КУКОЛДОВ"
  ],
  en:[
    "REGULAR CUCKOLD BOSS",
    "BURGUNDY CUCKOLD BOSS",
    "NIGHT CUCKOLD BOSS",
    "CUCKOLD BOSS FROM APT. 13",
    "ABSOLUTE CUCKOLD BOSS"
  ]
};

function startBoss(){
  if(bossActive)return;

  bossActive=true;
  bossPhase=1;
  bossShield=1;

  bossMax=
    5500*
    Math.pow(2.12,g.bosses)*
    (1+g.prestiges*.4);

  bossHP=bossMax;

  $("boss").classList.add("show");
  $("boss").classList.remove("enraged");

  $("bossName").textContent=
    BOSS_VARIANTS[lang][g.bosses%BOSS_VARIANTS[lang].length];

  $("bossSkill").textContent=
    lang==="ru"?"ФАЗА I · смотрит":"PHASE I · watching";

  updateBoss();

  haptic("heavy");
}

$("bossButton").onclick=startBoss;

function bossDamage(amount){
  if(!bossActive)return;

  amount*=bossShield;

  bossHP-=amount;

  if(bossHP<=bossMax*.65&&bossPhase===1){
    bossPhase=2;
    bossShield=.88;

    $("boss").classList.add("enraged");

    $("bossSkill").textContent=
      lang==="ru"
        ?"ФАЗА II · защита +12%"
        :"PHASE II · defense +12%";

    message(
      lang==="ru"
        ?"БОСС КУКОЛДОВ разозлился"
        :"CUCKOLD BOSS became enraged"
    );
  }

  if(bossHP<=bossMax*.25&&bossPhase===2){
    bossPhase=3;
    bossShield=.72;

    $("bossSkill").textContent=
      lang==="ru"
        ?"ФАЗА III · защита +28%"
        :"PHASE III · defense +28%";

    /*
    В третьей фазе отнимает часть ярости.
    */
    g.rage=Math.max(0,g.rage-20);

    message(
      lang==="ru"
        ?"ФИНАЛЬНАЯ ФАЗА · босс украл 20% ритма"
        :"FINAL PHASE · boss stole 20% rhythm"
    );
  }

  if(bossHP<=0){
    killBoss();
    return;
  }

  updateBoss();
}

function updateBoss(){
  $("bossHP").style.width=
    Math.max(0,bossHP/bossMax*100)+"%";

  $("bossHPText").textContent=
    fmt(Math.max(0,bossHP))+" / "+fmt(bossMax)+" HP";
}

function killBoss(){
  if(!bossActive)return;

  bossActive=false;
  g.bosses++;

  $("boss").classList.remove("show","enraged");

  const reward=bossMax*.55*allMulti();

  addSouls(reward);

  contractProgress("boss",1);

  makeLoot(true);

  if(Math.random()<.4)dropRecord();

  if(Math.random()<.25)g.keys++;

  haptic("success");

  message(
    (lang==="ru"?"БОСС КУКОЛДОВ побеждён · +":"CUCKOLD BOSS defeated · +")+
    fmt(reward)
  );

  update();
}

$("leaveBoss").onclick=()=>{
  bossActive=false;
  $("boss").classList.remove("show","enraged");
};

/* =========================
   TIGGO
========================= */

function carHTML(){
  return `
    <div class="car-roof"></div>
    <div class="car-window"></div>
    <div class="car-body">
      <div class="car-logo">TIGGO</div>
    </div>
    <div class="wheel w1"></div>
    <div class="wheel w2"></div>
  `;
}

function spawnTiggo(kind="normal"){
  if(document.querySelector(".tiggo"))return;

  const car=document.createElement("div");

  car.className=
    "tiggo drive "+
    (kind==="black"?"black-tiggo ":"")+
    (kind==="golden"?"golden-tiggo ":"");

  car.innerHTML=carHTML();

  car.style.top=
    (175+Math.random()*Math.max(40,innerHeight-390))+"px";

  document.body.appendChild(car);

  const timer=setTimeout(()=>{
    if(car.isConnected)car.remove();
  },7000);

  car.onpointerdown=e=>{
    e.preventDefault();
    e.stopPropagation();

    if(!car.isConnected)return;

    clearTimeout(timer);

    const r=car.getBoundingClientRect();

    explosion(
      r.left+r.width/2,
      r.top+r.height/2
    );

    car.remove();

    g.tiggos++;

    let reward=
      Math.max(1400,baseClick()*350)*
      allMulti();

    if(g.currentRoom==="kitchen")reward*=1.3;

    if(kind==="golden"){
      reward*=8;
      g.goldenTiggos++;
      g.keys++;

      makeLoot(true);

      message(
        lang==="ru"
          ?"GOLDEN TIGGO · +1 ключ"
          :"GOLDEN TIGGO · +1 key"
      );
    }

    addSouls(reward);

    contractProgress("tiggo",1);

    if(Math.random()<.18+dropBonus()){
      makeLoot();
    }

    if(Math.random()<.05){
      dropRecord();
    }

    haptic("success");

    update();
  };
}

function scheduleTiggo(){
  let base=20000+Math.random()*25000;

  if(g.currentRoom==="balcony"){
    base*=.72;
  }

  setTimeout(()=>{
    const roll=Math.random();

    if(roll<.035){
      spawnTiggo("golden");
    }else if(roll<.20){
      spawnBlackChase();
    }else{
      spawnTiggo();
    }

    scheduleTiggo();
  },base);
}

/* =========================
   BLACK TIGGO CHASE
========================= */

let chaseActive=false;

function spawnBlackChase(){
  if(chaseActive||document.querySelector(".tiggo"))return;

  chaseActive=true;

  const car=document.createElement("div");

  car.className="tiggo black-tiggo";
  car.innerHTML=carHTML();

  document.body.appendChild(car);

  const max=Math.max(140,baseClick()*55);
  let hp=max;
  let time=14;

  $("chase").classList.add("show");

  moveBlack(car);

  const mover=setInterval(()=>moveBlack(car),700);

  const timer=setInterval(()=>{
    time--;

    $("chaseTime").textContent=time;

    if(time<=0){
      clearInterval(timer);
      clearInterval(mover);

      chaseActive=false;

      if(car.isConnected)car.remove();

      $("chase").classList.remove("show");

      haptic("error");
    }
  },1000);

  car.onpointerdown=e=>{
    e.preventDefault();
    e.stopPropagation();

    let damage=baseClick()*clickMulti();

    if(Math.random()<critChance()){
      damage*=critPower();
      haptic("heavy");
    }

    if(rageActive)damage*=5;

    hp-=damage;

    $("chaseHP").style.width=Math.max(0,hp/max*100)+"%";

    $("chaseHPText").textContent=
      fmt(Math.max(0,hp))+" / "+fmt(max);

    if(hp<=0){
      clearInterval(timer);
      clearInterval(mover);

      chaseActive=false;

      const r=car.getBoundingClientRect();

      explosion(
        r.left+r.width/2,
        r.top+r.height/2
      );

      car.remove();

      $("chase").classList.remove("show");

      g.blackTiggos++;

      const reward=
        Math.max(7000,baseClick()*1500)*
        allMulti();

      addSouls(reward);

      makeLoot(true);

      if(Math.random()<.6)dropRecord();
      if(Math.random()<.22)g.keys++;

      haptic("success");

      update();
    }
  };

  $("chaseHP").style.width="100%";
  $("chaseHPText").textContent=fmt(max)+" / "+fmt(max);
}

function moveBlack(car){
  if(!car.isConnected)return;

  car.style.transition="left .58s ease,top .58s ease";

  car.style.left=
    (10+Math.random()*Math.max(50,innerWidth-260))+"px";

  car.style.top=
    (165+Math.random()*Math.max(40,innerHeight-355))+"px";
}

  document.body.appendChild(e);

  setTimeout(()=>e.remove(),700);
}

    $("eventText").textContent=
      lang==="ru"

  if(type==="mirror"){

      lang==="ru"?"Зеркало треснуло":"The mirror cracked";

    $("eventText").textContent=
      lang==="ru"

  }

  if(type==="phone"){
    $("eventTitle").textContent=
      lang==="ru"?"Звонит старый телефон":"The old phone is ringing";

    $("eventText").textContent=
      lang==="ru"
        ?"Поднять трубку?"
        :"Answer it?";
  }

  $("eventYes").textContent=
    lang==="ru"?"ДА":"YES";

  $("eventNo").textContent=
    lang==="ru"?"НЕТ":"NO";

  $("eventNo").onclick=closeEvent;

  $("eventYes").onclick=()=>{

    if(roll<.36){

      addSouls(reward);

      message("+"+fmt(reward));
    }else if(roll<.62){
      makeLoot();
    }else if(roll<.8){
      startNightShift();
    }else{
      startBoss();
    }

  setTimeout(()=>{
    if(eventOpen)closeEvent();
  },10000);

/* =========================
   UPDATE
========================= */

function update(){
  checkUnlocks();
  checkAchievements();

  $("souls").textContent=fmt(g.souls);

  $("sps").textContent=fmt(
    passiveBase()*passiveMulti()*allMulti()
  );

  $("clickPower").textContent=fmt(
    baseClick()*clickMulti()*allMulti()
  );

  $("allMulti").textContent=allMulti().toFixed(2);

  $("level").textContent=level();

  $("levelBar").style.width=
    Math.max(0,Math.min(100,levelProgress()))+"%";

  $("rageBar").style.width=Math.min(100,g.rage)+"%";

  $("lifetime").textContent=fmt(g.lifetime);
  $("clicks").textContent=fmt(g.clicks);
  $("bosses").textContent=g.bosses;
  $("tiggos").textContent=g.tiggos;
  $("keys").textContent=g.keys;

  const types=["click","auto","ring","crit","critPower"];

  types.forEach(type=>{
    $(type+"Cost").textContent=fmt(g[type+"Cost"]);

    $(type+"Lvl").textContent=
      (lang==="ru"?"ур. ":"lvl ")+g[type+"Lvl"];

    $("buy"+type[0].toUpperCase()+type.slice(1)).disabled=
      g.souls<g[type+"Cost"];
  });

  $("rageButton").disabled=g.rage<100;

  $("rageButton").textContent=
    g.rage>=100
      ?tx("rageReady")
      :tx("rage")+" "+Math.floor(g.rage)+"%";

  $("dailyButton").disabled=!dailyReady();

  $("dailyButton").textContent=tx("mail");

  $("bossButton").textContent=tx("callBoss");

  const chestRemaining=CHEST_CD-(Date.now()-g.lastChest);

  $("chestButton").disabled=
    !chestReady()||g.keys<1;

  $("chestButton").textContent=
    chestReady()
      ?tx("chest")+" · 🔑 "+g.keys
      :tx("chest")+" · "+Math.ceil(chestRemaining/60000)+"m";

  $("prestigeMulti").textContent=prestigeMulti().toFixed(2);

  $("prestigeButton").disabled=level()<50;

  $("prestigeButton").textContent=
    level()>=50?tx("prestigeReady"):tx("prestigeLocked");

  applySkin();
  applyRoom();

  renderContracts();
  renderAchievements();
}

/* =========================
   MUSIC
========================= */

const music=$("music");
const musicButton=$("musicButton");
const volume=$("volume");

let musicPlaying=false;

const savedVolume=localStorage.getItem("dm-volume");

if(savedVolume!==null){
  volume.value=savedVolume;
}

music.volume=Number(volume.value);

async function playMusic(){
  try{
    await music.play();
    musicPlaying=true;
    musicButton.textContent="♫";
  }catch(e){}
}

document.addEventListener("pointerdown",playMusic,{once:true});

musicButton.onclick=async e=>{
  e.stopPropagation();

  if(musicPlaying){
    music.pause();
    musicPlaying=false;
    musicButton.textContent="♪";
  }else{
    await playMusic();
  }
};

volume.oninput=()=>{
  music.volume=Number(volume.value);
  localStorage.setItem("dm-volume",volume.value);
};
