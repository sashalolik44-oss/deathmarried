<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<!-- Жесткий запрет зума и масштабирования -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>DEATHMARRIED KVARTIRA</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
/* =========================================================
   БАЗОВЫЕ НАСТРОЙКИ (ФИКС ЗУМА)
========================================================= */
:root {
    --wine: #702831;
    --gold: #aa8246;
    --ink: #2d1e19;
    --bg: #ded0b5;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none; /* Запрещаем все стандартные жесты, кроме того что разрешим вручную */
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #ded0b5;
    font-family: "Montserrat", sans-serif;
}

.wallpaper {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: linear-gradient(rgba(231,215,189,0.3), rgba(231,215,189,0.3)), 
                url("wallpaper.jpg") center/cover no-repeat;
    transition: filter 0.5s;
}

.floor {
    position: fixed;
    bottom: 0; width: 100%; height: 12vh;
    background: #493127;
    border-top: 5px solid #38261e;
    z-index: -1;
}

/* =========================================================
   ЗАСТАВКА
========================================================= */
.intro {
    position: fixed;
    inset: 0;
    z-index: 10000;
    background: #eee3cb;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.6s;
}
.intro.hide { opacity: 0; pointer-events: none; }
.intro-text {
    font-family: "Cormorant Garamond", serif;
    font-size: 32px;
    font-weight: 600;
    color: var(--wine);
    letter-spacing: 0.2em;
    text-align: center;
}

/* =========================================================
   HUD СТАТИСТИКА
========================================================= */
header {
    position: fixed;
    top: 10px; width: 100%; text-align: center;
    z-index: 100; pointer-events: none;
}
.logo-text { font-family: "Cormorant Garamond", serif; font-size: 34px; color: var(--wine); margin: 0; }

.stats-hud {
    position: fixed;
    top: 60px; left: 50%; transform: translateX(-50%);
    text-align: center; width: 100%; z-index: 100;
}
.souls-val { font-family: "Cormorant Garamond", serif; font-size: 40px; font-weight: 700; color: var(--ink); }

.bar-box {
    width: 220px; height: 4px; background: rgba(0,0,0,0.1);
    margin: 8px auto; border-radius: 2px; overflow: hidden;
}
.bar-fill { height: 100%; width: 0%; background: var(--wine); transition: width 0.3s; }

/* =========================================================
   ПЕРЕКЛЮЧАТЕЛИ (ОБЛИКИ И КОМНАТЫ) - ТЕПЕРЬ СЛЕВА СВЕРХУ
========================================================= */
.quick-access {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 500;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.qa-item {
    background: rgba(238, 222, 195, 0.9);
    border: 1px solid var(--gold);
    padding: 5px;
    display: flex;
    align-items: center;
    gap: 5px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.qa-btn {
    width: 30px; height: 30px;
    background: var(--wine);
    color: white;
    border: none;
    font-weight: bold;
    cursor: pointer;
    touch-action: manipulation;
}

.qa-label {
    width: 100px;
    text-align: center;
    font-size: 10px;
    font-weight: 600;
    color: var(--ink);
    overflow: hidden;
    white-space: nowrap;
}

/* =========================================================
   ГРОМКОСТЬ (ФИКС)
========================================================= */
.volume-control {
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 500;
    background: rgba(238, 222, 195, 0.9);
    border: 1px solid var(--gold);
    padding: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.volume-control input {
    touch-action: pan-x; /* РАЗРЕШАЕМ ДВИЖЕНИЕ ПАЛЬЦА ДЛЯ ПОЛЗУНКА */
    cursor: pointer;
    width: 80px;
    accent-color: var(--wine);
}

/* =========================================================
   ГЕЙМПЛЕЙ (ТЫКВА)
========================================================= */
.game-container {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
}

.character {
    position: relative;
    width: 340px;
    height: 340px;
    cursor: pointer;
    touch-action: manipulation;
}

.pumpkin-main {
    position: absolute;
    width: 220px;
    height: 180px;
    background: #d98446;
    border-radius: 50%;
    left: 60px;
    top: 80px;
    box-shadow: inset -15px -10px 40px rgba(0,0,0,0.4);
    transition: background 0.3s;
}

.headphones {
    position: absolute;
    width: 260px;
    height: 140px;
    border: 15px solid #1a1a1a;
    border-bottom: none;
    border-radius: 130px 130px 0 0;
    left: 40px;
    top: 50px;
}

/* =========================================================
   МЕНЮ И ШТОРКИ
========================================================= */
.pc-panels {
    position: fixed;
    top: 50%; transform: translateY(-50%);
    width: 280px;
    background: rgba(238, 222, 195, 0.98);
    border: 1px solid var(--gold);
    padding: 15px;
    z-index: 1000;
}
.p-left { left: 20px; }
.p-right { right: 20px; }

.btn {
    width: 100%;
    padding: 12px;
    margin-bottom: 8px;
    background: #f1e7d0;
    border: 1px solid var(--gold);
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
}

/* Мобильная панель */
.mob-nav {
    display: none;
    position: fixed;
    bottom: 0; width: 100%;
    background: #eee3cb;
    grid-template-columns: repeat(4, 1fr);
    border-top: 1px solid var(--gold);
    z-index: 2000;
    padding-bottom: env(safe-area-inset-bottom);
}
.mob-nav button { padding: 15px 5px; border: none; background: none; color: var(--wine); font-size: 9px; font-weight: 700; }

.sheet-modal {
    position: fixed;
    inset: 0; background: rgba(0,0,0,0.6);
    z-index: 3000; display: none;
    align-items: flex-end;
}
.sheet-inner {
    width: 100%; background: #f1e7d0;
    border-radius: 20px 20px 0 0;
    padding: 25px; max-height: 80vh; overflow-y: auto;
}

/* Анимация клика */
.soul-particle {
    position: fixed;
    pointer-events: none;
    font-family: serif;
    font-weight: bold;
    color: var(--wine);
    animation: fadeUp 0.8s forwards;
    z-index: 10000;
}
@keyframes fadeUp { to { transform: translateY(-100px); opacity: 0; } }

@media (max-width: 1100px) {
    .pc-panels { display: none; }
    .mob-nav { display: grid; }
    .character { transform: scale(0.85); }
    .quick-access { top: auto; bottom: 85px; left: 10px; }
}
</style>
</head>

<body>

<div class="intro" id="intro">
    <div class="intro-text">DEATHMARRIED<br>KVARTIRA</div>
</div>

<div class="wallpaper" id="wall"></div>
<div class="floor"></div>
<div class="vignette"></div>

<!-- Громкость -->
<div class="volume-control">
    <span style="font-size:12px">♪</span>
    <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="0.5">
</div>

<!-- Облики и комнаты (Слева) -->
<div class="quick-access">
    <div class="qa-item">
        <button class="qa-btn" onpointerdown="switchSkin(-1)">‹</button>
        <div class="qa-label" id="cur-skin">Death Head</div>
        <button class="qa-btn" onpointerdown="switchSkin(1)">›</button>
    </div>
    <div class="qa-item">
        <button class="qa-btn" onpointerdown="switchRoom(-1)">‹</button>
        <div class="qa-label" id="cur-room">Прихожая</div>
        <button class="qa-btn" onpointerdown="switchRoom(1)">›</button>
    </div>
</div>

<header>
    <h1 class="logo-text">DeathMarried</h1>
</header>

<div class="stats-hud">
    <div class="souls-val">† <span id="souls-text">0</span></div>
    <div class="minor"><span id="lang-sps">душ / сек</span>: <span id="sps-text">0</span></div>
    <div class="bar-box"><div class="bar-fill" id="exp-fill"></div></div>
    <div class="minor" style="color:var(--wine)">Уровень <span id="lvl-text">1</span></div>
</div>

<div class="game-container">
    <div class="character" id="main-target">
        <div class="headphones"></div>
        <div class="pumpkin-main" id="pumpkin-color"></div>
    </div>
</div>

<!-- ПК Интерфейс -->
<div class="pc-panels p-left">
    <h3>Профиль</h3>
    <div class="stat">Всего душ: <strong id="all-souls">0</strong></div>
    <button class="btn" onpointerdown="setLang('ru')">RU</button>
    <button class="btn" onpointerdown="setLang('en')">EN</button>
</div>

<div class="pc-panels p-right">
    <h3>Магазин</h3>
    <button class="btn" onpointerdown="buyUp('click')">Нож (ур. <span id="u-click">0</span>)</button>
    <button class="btn" onpointerdown="buyUp('auto')">Свеча (ур. <span id="u-auto">0</span>)</button>
</div>

<!-- Мобильное Меню -->
<div class="mob-nav">
    <button onpointerdown="openModal('profile')">ПРОФИЛЬ</button>
    <button onpointerdown="openModal('shop')">МАГАЗИН</button>
    <button onpointerdown="openModal('skins')">ГАРДЕРОБ</button>
    <button onpointerdown="openModal('items')">ВЕЩИ</button>
</div>

<!-- Шторка -->
<div class="sheet-modal" id="modal">
    <div class="sheet-inner">
        <div id="modal-content"></div>
        <button class="btn" style="background:var(--wine); color:white; margin-top:20px;" onpointerdown="closeModal()">ЗАКРЫТЬ</button>
    </div>
</div>

<audio id="music-player" loop><source src="music.mp3" type="audio/mpeg"></audio>

<script>
/* =========================================================
   ЛОГИКА ИГРЫ (V5)
========================================================= */

let state = {
    souls: 0,
    lifetime: 0,
    lvl: 1,
    upgrades: { click: 0, auto: 0 },
    currentSkin: 0,
    currentRoom: 0,
    unlockedSkins: [0],
    unlockedRooms: [0],
    lang: 'ru'
};

const SKINS = ["Death Head", "DJ Pumpkin", "Horned", "Viscount", "Void"];
const ROOMS = ["Прихожая", "Гостиная", "DJ-Студия", "Спальня", "Секретная"];
const COLORS = ["#d98446", "#762b33", "#35566a", "#a9844c", "#2d1e19"];

// Загрузка
const saved = localStorage.getItem('dm_final_v5');
if(saved) state = Object.assign(state, JSON.parse(saved));

const soulsDisplay = document.getElementById("souls-text");
const pumpkin = document.getElementById("main-target");
const music = document.getElementById("music-player");

function updateUI() {
    soulsDisplay.innerText = Math.floor(state.souls).toLocaleString();
    document.getElementById("sps-text").innerText = (state.upgrades.auto * 2).toLocaleString();
    document.getElementById("lvl-text").innerText = state.lvl;
    document.getElementById("all-souls").innerText = Math.floor(state.lifetime).toLocaleString();
    
    // Опыт
    let target = Math.pow(state.lvl, 2) * 300;
    let prev = Math.pow(state.lvl - 1, 2) * 300;
    let progress = ((state.lifetime - prev) / (target - prev)) * 100;
    document.getElementById("exp-fill").style.width = Math.min(100, progress) + "%";

    if(progress >= 100) {
        state.lvl++;
        if(tg) tg.HapticFeedback.notificationOccurred('success');
        checkUnlocks();
    }

    // Магазин
    document.getElementById("u-click").innerText = state.upgrades.click;
    document.getElementById("u-auto").innerText = state.upgrades.auto;
    
    document.getElementById("cur-skin").innerText = SKINS[state.currentSkin];
    document.getElementById("cur-room").innerText = ROOMS[state.currentRoom];
    document.getElementById("pumpkin-color").style.background = COLORS[state.currentSkin];
}

/* МГНОВЕННЫЙ КЛИК */
pumpkin.onpointerdown = (e) => {
    e.preventDefault();
    let p = 1 + state.upgrades.click;
    state.souls += p;
    state.lifetime += p;
    
    if(tg) tg.HapticFeedback.impactOccurred('light');
    
    createParticle(e.clientX, e.clientY, "+" + p);
    updateUI();
};

function createParticle(x, y, text) {
    let p = document.createElement("div");
    p.className = "soul-particle";
    p.innerText = text;
    p.style.left = x + "px";
    p.style.top = y + "px";
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 800);
}

/* ПЕРЕКЛЮЧАТЕЛИ */
function switchSkin(dir) {
    state.currentSkin = (state.currentSkin + dir + SKINS.length) % SKINS.length;
    haptic('select');
    updateUI();
}

function switchRoom(dir) {
    state.currentRoom = (state.currentRoom + dir + ROOMS.length) % ROOMS.length;
    haptic('select');
    updateUI();
}

function buyUp(type) {
    let cost = type === 'click' ? 25 * Math.pow(1.6, state.upgrades.click) : 50 * Math.pow(1.6, state.upgrades.auto);
    if(state.souls >= cost) {
        state.souls -= cost;
        state.upgrades[type]++;
        haptic('success');
        updateUI();
        save();
    }
}

/* ГРОМКОСТЬ (ФИКС ДЛЯ ТЕЛЕФОНА) */
const volSlider = document.getElementById("vol-slider");
volSlider.addEventListener('input', () => {
    music.volume = volSlider.value;
});

/* МОБИЛЬНЫЕ ОКНА */
function openModal(type) {
    let content = document.getElementById("modal-content");
    if(type === 'shop') {
        content.innerHTML = `<h2>Магазин</h2>
        <button class="btn" onpointerdown="buyUp('click')">Улучшить Нож</button>
        <button class="btn" onpointerdown="buyUp('auto')">Купить Свечу</button>`;
    } else if(type === 'profile') {
        content.innerHTML = `<h2>Профиль</h2><p>Всего собрано: ${fmt(state.lifetime)}</p><p>Уровень: ${state.lvl}</p>`;
    } else {
        content.innerHTML = `<h2>Инвентарь</h2><p>Пока здесь пусто...</p>`;
    }
    document.getElementById("modal").style.display = "flex";
}

function closeModal() { document.getElementById("modal").style.display = "none"; }

function checkUnlocks() {
    // В будущем тут можно открывать новые скины за уровни
}

function fmt(n) { return Math.floor(n).toLocaleString(); }
function haptic(s) { if(tg) tg.HapticFeedback.impactOccurred(s); }
function save() { localStorage.setItem('dm_final_v5', JSON.stringify(state)); }

window.onload = () => {
    setTimeout(() => document.getElementById("intro").classList.add("hide"), 2000);
    initTelegram();
    updateUI();
    
    setInterval(() => {
        let gain = (state.upgrades.auto * 2) / 10;
        state.souls += gain;
        state.lifetime += gain;
        updateUI();
    }, 100);

    // Музыка по первому касанию
    document.body.addEventListener('pointerdown', () => {
        if(music.paused) music.play().catch(()=>{});
    }, {once: true});
};

function setLang(l) { state.lang = l; save(); location.reload(); }
</script>
</body>
</html>
