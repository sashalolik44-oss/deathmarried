<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<!-- Жесткий фикс масштабирования -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DEATHMARRIED KVARTIRA</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
/* =========================================================
   БАЗОВЫЙ СТИЛЬ И ФИКСЫ
========================================================= */
:root {
    --wine: #702831;
    --wine-l: #913a44;
    --gold: #aa8246;
    --ink: #2d1e19;
    --bg: #ded0b5;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden; /* Запрет скролла всей страницы */
    background: var(--bg);
    font-family: "Montserrat", sans-serif;
    position: fixed; /* Фикс для iOS, чтобы не прыгало */
}

/* Фон */
.wallpaper {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: linear-gradient(rgba(231,215,189,0.3), rgba(231,215,189,0.3)), 
                url("wallpaper.jpg") center/cover no-repeat;
}

/* =========================================================
   ЗАСТАВКА
========================================================= */
.loader {
    position: fixed;
    inset: 0;
    z-index: 10000;
    background: #eee3cb;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.5s;
}
.loader.hide { opacity: 0; pointer-events: none; }
.loader-text {
    font-family: "Cormorant Garamond", serif;
    font-size: 32px;
    font-weight: 600;
    color: var(--wine);
    letter-spacing: 0.1em;
}

/* =========================================================
   HUD (СТАТИСТИКА СВЕРХУ)
========================================================= */
.top-hud {
    position: fixed;
    top: 0;
    width: 100%;
    padding-top: 20px;
    text-align: center;
    z-index: 100;
    pointer-events: none;
}
.souls-display {
    font-family: "Cormorant Garamond", serif;
    font-size: 42px;
    font-weight: 700;
    color: var(--wine);
}
.sps-display {
    font-size: 10px;
    color: var(--muted);
    margin-top: -5px;
}
.level-bar-container {
    width: 180px;
    height: 4px;
    background: rgba(0,0,0,0.1);
    margin: 10px auto;
    border-radius: 2px;
    overflow: hidden;
    pointer-events: auto;
}
.level-bar-fill {
    height: 100%;
    width: 0%;
    background: var(--wine);
    transition: width 0.3s;
}

/* =========================================================
   ИГРОВАЯ ЗОНА
========================================================= */
.game-container {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
}
.character {
    position: relative;
    width: 320px;
    height: 320px;
    cursor: pointer;
    touch-action: manipulation;
}
.character:active { transform: scale(0.95); }

.pumpkin-body {
    position: absolute;
    width: 200px;
    height: 160px;
    background: #d98446;
    border-radius: 50%;
    left: 60px;
    top: 80px;
    box-shadow: inset -15px -10px 30px rgba(0,0,0,0.3);
}

.headphones-line {
    position: absolute;
    width: 240px;
    height: 120px;
    border: 12px solid #222;
    border-bottom: none;
    border-radius: 120px 120px 0 0;
    left: 40px;
    top: 50px;
}

/* =========================================================
   ИНТЕРФЕЙС ПАНЕЛЕЙ (ПК И МОБИЛКА)
========================================================= */

/* Десктопные панели (скрыты на малых экранах) */
.pc-panel {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 300px;
    background: rgba(238, 222, 195, 0.98);
    border: 1px solid var(--gold);
    padding: 20px;
    z-index: 500;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}
.pc-left { left: 20px; }
.pc-right { right: 20px; }

/* Мобильное меню (снизу) */
.mobile-menu {
    display: none;
    position: fixed;
    bottom: 0;
    width: 100%;
    background: #eee3cb;
    grid-template-columns: repeat(4, 1fr);
    z-index: 1000;
    border-top: 1px solid var(--gold);
    padding-bottom: env(safe-area-inset-bottom);
}
.mobile-menu button {
    padding: 15px 5px;
    border: none;
    background: none;
    font-size: 9px;
    font-weight: 600;
    color: var(--wine);
    text-transform: uppercase;
}

/* Всплывающие окна (Шторки) */
.sheet-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 2000;
    display: none;
    align-items: flex-end;
}
.sheet-content {
    width: 100%;
    background: #f1e7d0;
    border-radius: 20px 20px 0 0;
    padding: 20px;
    max-height: 80vh;
    overflow-y: auto;
}

/* Кнопки действий */
.btn-action {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    background: #e7d7bd;
    border: 1px solid var(--gold);
    color: var(--ink);
    font-weight: 600;
    font-family: inherit;
}

/* Переключатели облика */
.skin-selector {
    position: fixed;
    left: 20px;
    top: 120px;
    z-index: 200;
    background: rgba(238, 222, 195, 0.9);
    padding: 10px;
    border: 1px solid var(--gold);
}

/* Босс КУКОЛДОВ */
.boss-box {
    position: fixed;
    top: 10px;
    right: 10px;
    background: #fff;
    border: 2px solid var(--wine);
    padding: 10px;
    width: 220px;
    z-index: 3000;
    display: none;
}

@media (max-width: 1100px) {
    .pc-panel { display: none; }
    .mobile-menu { display: grid; }
    .skin-selector { top: auto; bottom: 80px; left: 10px; }
}

/* Анимация клика */
.floating-souls {
    position: fixed;
    pointer-events: none;
    font-family: "Cormorant Garamond", serif;
    font-weight: bold;
    color: var(--wine);
    z-index: 5000;
    animation: moveUp 0.8s ease-out forwards;
}
@keyframes moveUp {
    to { transform: translateY(-100px); opacity: 0; }
}
</style>
</head>
<body>

<div class="loader" id="loader">
    <div class="loader-text">DEATHMARRIED KVARTIRA</div>
</div>

<div class="wallpaper"></div>
<div class="floor"></div>
<div class="vignette"></div>

<!-- HUD -->
<div class="top-hud">
    <div class="souls-display">† <span id="souls-count">0</span></div>
    <div class="sps-display"><span id="lang-sps">душ / сек.</span>: <span id="sps-count">0</span></div>
    <div class="level-bar-container"><div class="level-bar-fill" id="exp-fill"></div></div>
    <div style="font-size: 10px; color: var(--wine);"><span id="lang-lvl">Уровень</span> <span id="lvl-num">1</span></div>
</div>

<!-- GAME -->
<div class="game-container">
    <div class="character" id="pumpkin-dj">
        <div class="headphones-line"></div>
        <div class="pumpkin-body"></div>
    </div>
</div>

<!-- ПК ПАНЕЛИ -->
<div class="pc-panel pc-left">
    <h3 id="lang-profile">ПРОФИЛЬ</h3>
    <div class="stat"><span id="lang-all-souls">Всего душ</span>: <strong id="lifetime-count">0</strong></div>
    <div class="stat"><span id="lang-keys">Ключей</span>: <strong id="keys-count">0</strong></div>
    <button class="btn-action" onpointerdown="openChest()">ОТКРЫТЬ СУНДУК</button>
    <button class="btn-action" onpointerdown="setLang('ru')">RU</button>
    <button class="btn-action" onpointerdown="setLang('en')">EN</button>
</div>

<div class="pc-panel pc-right">
    <h3 id="lang-shop">МАГАЗИН</h3>
    <button class="btn-action" onpointerdown="buy('click')">Нож (ур. <span id="l-click">0</span>) - <span id="c-click">25</span> †</button>
    <button class="btn-action" onpointerdown="buy('auto')">Свеча (ур. <span id="l-auto">0</span>) - <span id="c-auto">50</span> †</button>
    <button class="btn-action" onpointerdown="spawnBoss()">ВЫЗВАТЬ БОССА</button>
</div>

<!-- МОБИЛЬНОЕ МЕНЮ -->
<div class="mobile-menu">
    <button onpointerdown="openSheet('profile')">ПРОФИЛЬ</button>
    <button onpointerdown="openSheet('shop')">МАГАЗИН</button>
    <button onpointerdown="openSheet('skins')">ОБЛИКИ</button>
    <button onpointerdown="openSheet('items')">ВЕЩИ</button>
</div>

<!-- ШТОРКА -->
<div class="sheet-overlay" id="sheet">
    <div class="sheet-content">
        <div id="sheet-data"></div>
        <button class="btn-action" onpointerdown="closeSheet()" style="background: var(--wine); color: #fff;">ЗАКРЫТЬ</button>
    </div>
</div>

<!-- БОСС -->
<div class="boss-box" id="boss-ui">
    <div style="font-size: 9px; color: gray;">АКТИВНОЕ СОБЫТИЕ</div>
    <div style="font-weight: bold; color: var(--wine);">БОСС КУКОЛДОВ</div>
    <div class="level-bar-container" style="width: 100%;"><div class="level-bar-fill" id="boss-hp" style="width: 100%;"></div></div>
    <button class="btn-action" style="font-size: 10px; padding: 5px;" onpointerdown="leaveBoss()">СБЕЖАТЬ</button>
</div>

<audio id="bg-music" loop><source src="music.mp3" type="audio/mpeg"></audio>

<script>
/* =========================================================
   ЯДРО ИГРЫ
========================================================= */

let g = {
    souls: 0,
    lifetime: 0,
    lvl: 1,
    keys: 0,
    upgrades: { click: 0, auto: 0 },
    lang: 'ru',
    currentSkin: 'default',
    items: []
};

// Загрузка
const save = localStorage.getItem('dm_kvartira_v4');
if(save) g = Object.assign(g, JSON.parse(save));

const soulsVal = $("souls-count");
const expFill = $("exp-fill");

function updateUI() {
    soulsVal.innerText = fmt(g.souls);
    $("sps-count").innerText = fmt(getSPS());
    $("lvl-num").innerText = g.lvl;
    $("lifetime-count").innerText = fmt(g.lifetime);
    $("keys-count").innerText = g.keys;

    // Опыт
    let target = Math.pow(g.lvl, 2) * 250;
    let prev = Math.pow(g.lvl - 1, 2) * 250;
    let progress = ((g.lifetime - prev) / (target - prev)) * 100;
    expFill.style.width = Math.min(100, progress) + "%";

    if(progress >= 100) {
        g.lvl++;
        g.keys++;
        haptic('success');
    }

    // Кнопки магазина
    $("l-click").innerText = g.upgrades.click;
    $("c-click").innerText = fmt(25 * Math.pow(1.6, g.upgrades.click));
    $("l-auto").innerText = g.upgrades.auto;
    $("c-auto").innerText = fmt(50 * Math.pow(1.6, g.upgrades.auto));
}

function getSPS() {
    return g.upgrades.auto * 2 * (1 + (g.prestiges || 0) * 0.2);
}

function fmt(n) {
    if(n < 1000) return Math.floor(n);
    if(n < 1000000) return (n/1000).toFixed(1) + "k";
    return (n/1000000).toFixed(2) + "m";
}

/* КЛИК СИСТЕМА (МГНОВЕННАЯ) */
$("pumpkin-dj").onpointerdown = (e) => {
    e.preventDefault();
    haptic('light');

    let power = (1 + g.upgrades.click) * (1 + g.items.length * 0.1);
    
    if(bossActive) {
        bossHP -= power;
        updateBoss();
    } else {
        g.souls += power;
        g.lifetime += power;
    }
    
    showFloat(e.clientX, e.clientY, "+" + Math.floor(power));
    updateUI();
};

/* БОСС КУКОЛДОВ */
let bossActive = false;
let bossHP = 0;
let bossMax = 0;

function spawnBoss() {
    if(bossActive) return;
    bossActive = true;
    bossMax = g.lvl * 2000;
    bossHP = bossMax;
    $("boss-ui").style.display = "block";
    haptic('heavy');
}

function updateBoss() {
    $("boss-hp").style.width = (bossHP/bossMax)*100 + "%";
    if(bossHP <= 0) {
        bossActive = false;
        $("boss-ui").style.display = "none";
        let rew = bossMax * 0.6;
        g.souls += rew;
        g.lifetime += rew;
        g.keys += 1;
        message("Босс побежден! Награда: " + fmt(rew));
        haptic('success');
    }
}

function leaveBoss() {
    bossActive = false;
    $("boss-ui").style.display = "none";
}

/* МАГАЗИН */
function buy(type) {
    let cost = type === 'click' ? 25 * Math.pow(1.6, g.upgrades.click) : 50 * Math.pow(1.6, g.upgrades.auto);
    if(g.souls >= cost) {
        g.souls -= cost;
        g.upgrades[type]++;
        haptic('select');
        updateUI();
        save();
    }
}

/* МОБИЛЬНЫЙ ИНТЕРФЕЙС (ШТОРКА) */
function openSheet(type) {
    let data = $("sheet-data");
    if(type === 'profile') {
        data.innerHTML = `<h2>Профиль</h2><p>Всего душ: ${fmt(g.lifetime)}</p><p>Ключей: ${g.keys}</p>`;
    } else if(type === 'shop') {
        data.innerHTML = `<h2>Магазин</h2>
        <button class="btn-action" onpointerdown="buy('click')">Улучшить нож (${fmt(25 * Math.pow(1.6, g.upgrades.click))} †)</button>
        <button class="btn-action" onpointerdown="buy('auto')">Купить свечу (${fmt(50 * Math.pow(1.6, g.upgrades.auto))} †)</button>`;
    } else {
        data.innerHTML = `<h2>${type}</h2><p>Скоро в обновлении!</p>`;
    }
    $("sheet").style.display = "flex";
}

function closeSheet() { $("sheet").style.display = "none"; }

/* ТЕХНИЧЕСКОЕ */
function haptic(style) {
    if(tg) {
        if(style === 'light') tg.HapticFeedback.impactOccurred('light');
        if(style === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
        if(style === 'success') tg.HapticFeedback.notificationOccurred('success');
        if(style === 'select') tg.HapticFeedback.selectionChanged();
    }
}

function showFloat(x, y, text) {
    let el = document.createElement("div");
    el.className = "floating-souls";
    el.innerText = text;
    el.style.left = x + "px";
    el.style.top = y + "px";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 800);
}

function message(txt) {
    tg?.MainButton.setText(txt).show();
    setTimeout(() => tg?.MainButton.hide(), 3000);
}

function save() { localStorage.setItem('dm_kvartira_v4', JSON.stringify(g)); }

window.onload = () => {
    setTimeout(() => $("loader").classList.add("hide"), 2000);
    applyLanguage(); // Применяем тексты
    updateUI();
    
    // Автодоход
    setInterval(() => {
        if(!bossActive) {
            let gain = getSPS() / 10;
            g.souls += gain;
            g.lifetime += gain;
            updateUI();
        }
    }, 100);
    setInterval(save, 5000);
    
    // Музыка при первом клике
    document.body.addEventListener('pointerdown', () => {
        let m = $("bg-music");
        if(m.paused) m.play().catch(()=>{});
    }, {once: true});
};

function setLang(l) { g.lang = l; save(); location.reload(); }

function applyLanguage() {
    if(g.lang === 'en') {
        $("lang-sps").innerText = "souls / sec";
        $("lang-lvl").innerText = "Level";
        $("lang-profile").innerText = "PROFILE";
        $("lang-shop").innerText = "SHOP";
        // и т.д.
    }
}

function $("id") { return document.getElementById($("id")); } // shortcut для id
function $(id) { return document.getElementById(id); }
</script>
</body>
</html>
